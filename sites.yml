# Registry of sites and staging servers.
# Read only by the control server (wpd). Changes take effect from the next pipeline job.

staging_domain: devphase.io        # <slug>.devphase.io

staging_servers:
  stg1:                                    # control server
    backend: native                        # nginx + php-fpm + MySQL as services
    host: 127.0.0.1                        # SSH from control; stg1 is the control server itself
    public_ip: 162.243.160.209             # for DNS records
    php: ["7.4", "8.2", "8.3"]             # FPM versions actually running on stg1 (audit 2026-09-23)

defaults:
  type: wordpress                          # wordpress | static | drupal (laravel: not implemented yet)
  php: "8.2"
  staging:
    server: stg1                           # default server (wildcard *.devphase.io, DNS only)
    mode: fresh                            # fresh | clone-prod
    ssl_cert: true                         # true: DNS only (wildcard * is already grey) + Let's Encrypt, like all existing sites
                                           # false: separate Proxied record + Cloudflare Origin CA
    uploads: none                          # none | proxy (missing uploads are fetched from prod.url)
    # deactivated after a prod DB import (clone-prod): security/cache plugins and every mailer that sends
    # through an HTTP API instead of PHPMailer, which would bypass Mailpit
    deactivate_plugins: [wordfence, updraftplus, litespeed-cache, w3-total-cache, wp-rocket,
                         wp-mail-smtp, sparkpost, post-smtp, fluent-smtp, easy-wp-smtp, mailgun,
                         wp-ses, sendgrid-email-delivery-simplified, mailpoet,
                         duo-wordpress, duo-wordpress1, duo-universal, two-factor, wp-2fa, cloudflare,
                         wp-fastest-cache, fast-velocity-minify, autoptimize, wp-optimize,
                         all-in-one-wp-migration, wp-all-export]
  # Drupal modules disabled after a prod DB import (2FA, mailers, captcha, analytics)
  drupal:
    disable_modules: [tfa, smtp, symfony_mailer, mailsystem, securelogin, captcha, recaptcha, google_analytics]

sites:
  # --- pilot ---
  testandrew:                              # = gitlab.com/devphase/testandrew → testandrew.devphase.io
    theme_dir: testandrew                  # wp-content/themes/<theme_dir>
    staging:
      mode: fresh
    prod:
      driver: ssh
      host: test.devphase.io
      port: 22
      user: deploy                         # created by prod/setup-deploy-user.sh, not root
      wp_root: /var/www/test.devphase.io/public_html
      url: https://test.devphase.io
      keep_releases: 5
      healthcheck: [/]
      post_deploy:
        - wp cache flush

  # --- commas: devphase/commas-2025, branch "staging" (CI/CD variable WPD_STAGING_BRANCH=staging) ---
  # migrated 2026-11 from the legacy vhost commas.devphase.io; prod: https://usecommas.com (WordPress 7.1.2)
  commas-2025:
    slug: commas                             # → commas.devphase.io
    php: "8.2"
    wp_version: "7.1.2"                      # same as prod, so the imported database matches the core
    paths:
      wp-content/themes/skeleton-wp: wp-content/themes/skeleton-wp
      wp-content/plugins/starter: wp-content/plugins/starter
      static: static                         # served from the WordPress root, like on prod

  # --- truepoint: devphase/truepoint-wp, branch "staging" (CI/CD variable WPD_STAGING_BRANCH=staging) ---
  # migrated 2026-11 from the legacy truepoint.devphase.io; prod: https://truepointwealth.com (WordPress 7.1.2, prefix tp_)
  truepoint-wp:
    slug: truepoint                          # → truepoint.devphase.io
    php: "8.2"
    wp_version: "7.1.2"
    paths:
      wp-content/themes/truepoint: wp-content/themes/truepoint
      static: static

  # --- gcfdn: devphase/gcfdn, branch develop ---
  # prod: WordPress multisite gcfdn.org (WordPress 7.0.4, prefix gcf_); staging serves only womensfund.gcfdn.org
  # (blog_id 2). Imported 2026-11 as the whole multisite database; the multisite setup (domains, wp-config
  # constants, network plugins) is maintained by hand on stg1 — see /root/womensfund-plugins.sh.
  gcfdn:
    slug: womensfund                         # → womensfund.devphase.io
    php: "8.3"
    wp_version: "7.0.4"
    paths:
      wp-content/themes/gcf: wp-content/themes/gcf
      wp-content/plugins/angelleye-gravity-forms-braintree: wp-content/plugins/angelleye-gravity-forms-braintree
      wp-content/plugins/gcf-bb-additional-modules: wp-content/plugins/gcf-bb-additional-modules
      wp-content/plugins/gcf-plaid-grantee-data-confirmation: wp-content/plugins/gcf-plaid-grantee-data-confirmation
      wp-content/plugins/gravityformspaypalpaymentspro: wp-content/plugins/gravityformspaypalpaymentspro

  # --- drupal test repo: devphase/pipeline-test-drupal (Drupal 11 needs PHP 8.3) ---
  pipeline-test-drupal:
    type: drupal
    php: "8.3"
    drupal:
      install_profile: wpd_test_profile    # used only when the database is empty (first deploy); default: minimal

  # --- static site test repo: devphase/pipeline-test-static ---
  pipeline-test-static:
    type: static

