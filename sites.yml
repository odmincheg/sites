# Реєстр сайтів і staging-серверів.
# Читає лише control-сервер (wpd). Зміни набирають чинності з наступної джоби пайплайну.

staging_domain: devphase.io        # <slug>.devphase.io

staging_servers:
  stg1:                                    # control-сервер
    backend: native                        # nginx + php-fpm + MySQL як сервіси
    host: 127.0.0.1                        # SSH від control; stg1 і є control
    public_ip: 162.243.160.209             # для DNS-записів
    php: ["7.4", "8.2", "8.3"]             # FPM, що реально запущені на stg1 (аудит 2026-09-23)

defaults:
  php: "8.2"
  staging:
    server: stg1                           # сервер за замовчуванням (wildcard *.devphase.io, DNS only)
    mode: fresh                            # fresh | clone-prod
    ssl_cert: true                         # true: DNS only (wildcard * уже сірий) + Let's Encrypt, як у всіх існуючих сайтів
                                           # false: окремий Proxied-запис + Cloudflare Origin CA
    uploads: none                          # none | proxy (відсутні uploads беруться з prod.url)
    deactivate_plugins: [wordfence, wp-mail-smtp, updraftplus, litespeed-cache, w3-total-cache, wp-rocket]

sites:
  # --- пілот ---
  testandrew:                              # = gitlab.com/devphase/testandrew → testandrew.devphase.io
    theme_dir: testandrew                  # wp-content/themes/<theme_dir>
    staging:
      mode: fresh
    prod:
      driver: ssh
      host: test.thedevops.pro
      port: 22
      user: deploy                         # створюється prod/setup-deploy-user.sh, не root
      wp_root: /var/www/test.thedevops.pro/public_html
      url: https://test.thedevops.pro
      keep_releases: 5
      healthcheck: [/]
      post_deploy:
        - wp cache flush

